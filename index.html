<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM OEE · Production Entry</title>
<style>
  :root{
    --navy:#0f2b46; --navy2:#16456e; --blue:#2e86c1; --teal:#17a589; --orange:#e67e22;
    --red:#c0392b; --green:#1e8449; --purple:#8e44ad; --grey:#7f8c8d;
    --line:#e2e8ef; --bg:#eef1f5; --card:#fff; --ink:#1f2a33; --muted:#6b7783;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  .topbar{background:var(--navy);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .brand .mk{width:34px;height:34px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.5px}
  .brand small{display:block;font-weight:400;color:#b9cee0;font-size:11px}
  .topbar .spacer{flex:1}
  .topbar .plant{background:#1b3f61;border-radius:8px;padding:6px 12px;font-size:13px}
  .who{display:flex;align-items:center;gap:9px;font-size:13px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
  .nav button{background:none;border:none;padding:13px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
  .nav button.active{color:var(--navy);border-bottom-color:var(--navy)}
  .wrap{padding:20px;max-width:1400px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy)}
  .card .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .sec-title{font-size:13px;font-weight:700;color:var(--navy);margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
  .sec-title:first-child{margin-top:0}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:680px){.g4,.g3,.g2{grid-template-columns:1fr}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}
  .kpi .v{font-size:26px;font-weight:700;color:var(--navy);line-height:1.1}
  .kpi .l{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:5px;text-transform:uppercase;font-weight:600}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--navy2)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #c7d9ea}
  .btn.ghost:hover{background:#f0f6fc}
  .btn.green{background:var(--teal)}.btn.green:hover{background:#128f76}
  .btn.red{background:var(--red)}.btn.red:hover{background:#a5311f}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cfd8e2;border-radius:8px;background:#fff;width:100%}
  .field input:read-only{background:#f3f6f9;color:#546e7a}
  .field input[type=number]{text-align:right}
  .inputgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .inputgrid.npt{grid-template-columns:repeat(5,1fr)}
  @media(max-width:1100px){.inputgrid{grid-template-columns:repeat(2,1fr)}.inputgrid.npt{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.inputgrid,.inputgrid.npt{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-weight:600;white-space:nowrap;position:sticky;top:0}
  td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top;white-space:nowrap}
  tr:nth-child(even) td{background:#fafcfe}
  .tw{width:100%;overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-grey{background:#e6eaee;color:#546e7a}.b-blue{background:#e3f0fa;color:#1c6ea4}
  .b-orange{background:#fdf0e2;color:#b06012}.b-red{background:#fdeaea;color:#a5311f}
  .b-green{background:#e0f7ea;color:#1E8449}.b-teal{background:#dcf5e6;color:#145A32}
  .b-purple{background:#f2e9f9;color:#6d33a3}
  .muted{color:var(--muted)}.small{font-size:12px}
  .bar{height:18px;border-radius:5px;background:#e8edf3;overflow:hidden}.bar>i{display:block;height:100%}
  .toast{position:fixed;right:18px;bottom:18px;background:#12304a;color:#fff;padding:12px 16px;border-radius:9px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .bk-row{display:grid;grid-template-columns:170px 1fr 1fr 100px 1fr 38px;gap:8px;margin-bottom:8px;align-items:center}
  @media(max-width:900px){.bk-row{grid-template-columns:1fr 1fr;}}
  .pill{display:inline-block;background:#eef3f8;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:2px 4px 2px 0;color:#40515f}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span{display:flex;align-items:center;gap:6px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .formula{background:#f7fafd;border:1px dashed #c7d9ea;border-radius:8px;padding:10px 12px;font-size:12px;color:#40515f;margin:6px 0 14px}
  @media(max-width:760px){.wrap{padding:13px 11px}.card{padding:13px}input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="toast"></div>
